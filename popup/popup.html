<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Privacy Guard</h1>
    <div id="page" class="muted">—</div>
  </header>

  <section>
    <h2>Domínios de terceira parte</h2>
    <div id="summary" class="muted"></div>
    <ul id="third-party"></ul>
  </section>

  <section>
    <h2>Cookies injetados</h2>
    <table id="cookie-summary">
      <thead>
        <tr><th></th><th>Sessão</th><th>Persistente</th><th>Total</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <ul id="cookies"></ul>
  </section>

  <section>
    <h2>Armazenamento HTML5</h2>
    <table id="storage-summary">
      <thead>
        <tr><th></th><th>1ª parte</th><th>3ª parte</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <ul id="storage"></ul>
  </section>

  <section>
    <h2>Bounce tracking e cookie sync</h2>
    <div id="navigation-summary" class="muted"></div>
    <ul id="navigation"></ul>
  </section>

  <section>
    <h2>Canvas fingerprint</h2>
    <div id="canvas-summary" class="muted"></div>
    <ul id="canvas"></ul>
  </section>

  <section>
    <h2>Hijacking e hooks</h2>
    <div id="hijack-summary" class="muted"></div>
    <ul id="hijack"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
